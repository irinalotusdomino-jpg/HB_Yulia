<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ой, я вспомнила 💭</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20x='8'%20y='27'%20width='48'%20height='31'%20rx='4'%20fill='%23ff6fa5'/%3E%3Crect%20x='5'%20y='18'%20width='54'%20height='13'%20rx='4'%20fill='%23ffd166'/%3E%3Crect%20x='28'%20y='18'%20width='8'%20height='40'%20fill='%23d4508b'/%3E%3Cpath%20d='M32%2018C24%205%2011%208%2016%2016c3%206%2016%202%2016%202zM32%2018C40%205%2053%208%2048%2016c-3%206-16%202-16%202z'%20fill='%23d4508b'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-sparks"></div>

  <main class="page">
    <h1>Ой, я вспомнила! 💭</h1>

    <div class="card">
      <p class="lead">
        Спасибо Киевинформатике, а то б и не встретились
        <span class="spoiler" id="spoiler">19 лет</span>
        тому 💞
      </p>
      <p class="hint" id="hint" style="margin-top:16px">✨ нажми на звёздочки, чтобы увидеть ✨</p>
    </div>

    <a class="btn pulse" href="gift.html" data-next>Далее →</a>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    var sp = document.getElementById("spoiler");
    sp.addEventListener("click", function () {
      if (sp.classList.contains("revealed")) return;
      sp.classList.add("revealed");
      document.getElementById("hint").style.visibility = "hidden";
      launchConfetti(50);
    });
  </script>
</body>
</html>
