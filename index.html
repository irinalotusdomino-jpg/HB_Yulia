<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Для Юли 💖</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-sparks"></div>

  <main class="page">
    <div class="main-photo-wrap" id="mainPhoto">🎂</div>
    <h1 class="fade-in-late" id="title"></h1>
    <p class="lead fade-in-later" id="subtitle"></p>
    <a class="btn pulse fade-in-later" href="congrats.html" data-next>Открыть 💌</a>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    document.getElementById("title").textContent = CONFIG.title;
    document.getElementById("subtitle").textContent = CONFIG.subtitle;

    // Главное фото; если файла ещё нет — остаётся смайлик-заглушка
    var img = new Image();
    img.onload = function () {
      var wrap = document.getElementById("mainPhoto");
      wrap.textContent = "";
      wrap.appendChild(img);
    };
    img.alt = "Юля";
    img.src = CONFIG.mainPhoto;
  </script>
</body>
</html>
