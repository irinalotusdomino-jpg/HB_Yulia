<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Для Юли 💖</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20x='8'%20y='27'%20width='48'%20height='31'%20rx='4'%20fill='%23ff6fa5'/%3E%3Crect%20x='5'%20y='18'%20width='54'%20height='13'%20rx='4'%20fill='%23ffd166'/%3E%3Crect%20x='28'%20y='18'%20width='8'%20height='40'%20fill='%23d4508b'/%3E%3Cpath%20d='M32%2018C24%205%2011%208%2016%2016c3%206%2016%202%2016%202zM32%2018C40%205%2053%208%2048%2016c-3%206-16%202-16%202z'%20fill='%23d4508b'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-sparks"></div>

  <main class="page">
    <div class="main-photo-wrap" id="mainPhoto">🎂</div>
    <h1 class="fade-in-late" id="title"></h1>
    <p class="lead fade-in-later" id="subtitle"></p>
    <div class="fade-in-later">
      <a class="btn pulse" href="congrats.html" data-next>Открыть 💌</a>
    </div>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    document.getElementById("title").textContent = CONFIG.title;
    document.getElementById("subtitle").textContent = CONFIG.subtitle;

    // Главное фото; если файла ещё нет — остаётся смайлик-заглушка
    var img = new Image();
    img.onload = function () {
      var wrap = document.getElementById("mainPhoto");
      wrap.textContent = "";
      wrap.appendChild(img);
    };
    img.alt = "Юля";
    img.src = CONFIG.mainPhoto;
  </script>
</body>
</html>
