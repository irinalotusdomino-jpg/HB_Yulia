<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Подарок 🎁</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-sparks"></div>

  <main class="page">
    <h1>А теперь подарок! 🎁</h1>

    <div class="gift-box" id="box" title="Нажми">🎁</div>
    <button class="btn pulse" id="openBtn">Открыть подарок</button>

    <section class="joke-reveal" id="joke">
      <div class="card">
        <p class="emoji-row"><span class="laugh">😂</span><span class="laugh">🤣</span><span class="laugh">😂</span></p>
        <p class="lead" style="margin-top:14px">
          Первое, что пришло мне на ум в виде подарка… но я не решилась 🙈
        </p>
        <p class="emoji-row" style="margin-top:14px"><span class="laugh">🤣</span><span class="laugh">😂</span><span class="laugh">🤣</span></p>
      </div>

      <a class="btn" id="jokeLink" href="#" target="_blank" rel="noopener">Посмотреть, что это было 😅</a>
      <a class="btn ghost" href="memory.html" data-next>Нажми далее →</a>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    document.getElementById("jokeLink").href = CONFIG.jokeLink;

    function open() {
      document.getElementById("openBtn").classList.add("hidden");
      document.getElementById("box").style.display = "none";
      document.getElementById("joke").classList.add("show");
      launchConfetti(60);
    }
    document.getElementById("openBtn").addEventListener("click", open);
    document.getElementById("box").addEventListener("click", open);
  </script>
</body>
</html>
