<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Поздравление 🎈</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20x='8'%20y='27'%20width='48'%20height='31'%20rx='4'%20fill='%23ff6fa5'/%3E%3Crect%20x='5'%20y='18'%20width='54'%20height='13'%20rx='4'%20fill='%23ffd166'/%3E%3Crect%20x='28'%20y='18'%20width='8'%20height='40'%20fill='%23d4508b'/%3E%3Cpath%20d='M32%2018C24%205%2011%208%2016%2016c3%206%2016%202%2016%202zM32%2018C40%205%2053%208%2048%2016c-3%206-16%202-16%202z'%20fill='%23d4508b'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Раскладка: заголовок сверху, фото по центру, кнопка внизу. Ничего не накладывается. */
    .page.cg { justify-content: flex-start; gap: 10px; padding: 22px 14px 22px; }
    .page.cg .congrats-top { background: none; backdrop-filter: none; -webkit-backdrop-filter: none; padding: 0; }
    .page.cg h2 { text-shadow: 0 3px 14px rgba(0, 0, 0, 0.45); }

    .deck { position: relative; flex: 1 1 auto; width: 100%; max-width: 560px; min-height: 50vh; }
    .play-wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }

    /* Фото показываются целиком (без обрезки лиц) и ложатся стопкой друг на друга */
    .deck .pop {
      position: absolute; left: 50%; top: 50%;
      width: auto; height: auto; aspect-ratio: auto;
      max-width: 84%; max-height: 90%;
      object-fit: contain;
      border: 5px solid #fff; border-radius: 12px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
      transform: translate(-50%, -50%) translate(var(--dx, 0px), var(--dy, 0px)) rotate(var(--r, 0deg));
      transition: opacity 0.7s ease;
      animation: deckIn 0.8s cubic-bezier(.2, .9, .3, 1.15) backwards;
    }
    .deck .pop.age1 { opacity: 0.8; }
    .deck .pop.age2 { opacity: 0.55; }
    .deck .pop.gone { opacity: 0; }
    @keyframes deckIn {
      from {
        opacity: 0;
        transform: translate(-50%, -50%) translate(var(--dx, 0px), calc(var(--dy, 0px) + 70px)) rotate(var(--r, 0deg)) scale(0.55);
      }
    }

    .page.cg .congrats-actions { min-height: 64px; justify-content: center; }
  </style>
</head>
<body>
  <div class="bg-sparks"></div>

  <main class="page cg">
    <div class="congrats-top">
      <h2>Тебя поздравляют! 🎉<span class="wave off" id="wave"><i></i><i></i><i></i><i></i><i></i></span></h2>
    </div>

    <div class="deck" id="stage">
      <div class="play-wrap" id="playWrap">
        <button class="btn pulse" id="playBtn">▶ Включить поздравление</button>
      </div>
    </div>

    <div class="congrats-actions">
      <a class="btn ghost hidden" id="nextBtn" href="joke.html" data-next>Далее →</a>
    </div>
  </main>

  <audio id="voice" preload="auto"></audio>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    var audio = document.getElementById("voice");
    var wave = document.getElementById("wave");
    var playBtn = document.getElementById("playBtn");
    var playWrap = document.getElementById("playWrap");
    var nextBtn = document.getElementById("nextBtn");
    audio.src = CONFIG.voice;

    var started = false;

    function showNext() { nextBtn.classList.remove("hidden"); }

    function startShow() {
      if (started) return;
      started = true;
      playWrap.style.display = "none";
      spawn();
      setInterval(spawn, 2600);
    }

    function play() {
      startShow();
      audio.play().then(function () {
        wave.classList.remove("off");
      }).catch(function () {
        // если записи нет — просто показываем фото и кнопку «Далее»
        showNext();
      });
    }

    playBtn.addEventListener("click", play);
    audio.addEventListener("ended", function () {
      wave.classList.add("off");
      showNext();
    });
    // запасной вариант: кнопка «Далее» появляется через 40 секунд в любом случае
    playBtn.addEventListener("click", function () { setTimeout(showNext, 40000); });

    // ---- всплывающие фото: стопка по центру ----
    var stage = document.getElementById("stage");
    var stack = [];
    var idx = 0;

    // заранее загружаем все фото, чтобы они появлялись без задержки
    CONFIG.photos.forEach(function (src) { var i = new Image(); i.src = src; });

    function refreshAges() {
      var n = stack.length;
      for (var i = n - 1; i >= 0; i--) {
        var el = stack[i], age = n - 1 - i;
        el.classList.remove("age1", "age2");
        if (age === 1) el.classList.add("age1");
        else if (age === 2) el.classList.add("age2");
        else if (age >= 3) {
          el.classList.add("gone");
          (function (e) { setTimeout(function () { e.remove(); }, 800); })(el);
          stack.splice(i, 1);
        }
      }
    }

    function spawn() {
      if (!CONFIG.photos.length) return;
      var src = CONFIG.photos[idx % CONFIG.photos.length];
      idx++;
      var img = new Image();
      img.className = "pop";
      img.alt = "";
      img.onload = function () {
        var w = stage.clientWidth, h = stage.clientHeight;
        img.style.setProperty("--dx", Math.round((Math.random() * 2 - 1) * w * 0.06) + "px");
        img.style.setProperty("--dy", Math.round((Math.random() * 2 - 1) * h * 0.04) + "px");
        img.style.setProperty("--r", (Math.random() * 12 - 6).toFixed(1) + "deg");
        stage.appendChild(img);
        stack.push(img);
        refreshAges();
      };
      img.onerror = function () { /* нет файла — пропускаем */ };
      img.src = src;
    }
  </script>
</body>
</html>
