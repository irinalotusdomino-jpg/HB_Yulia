<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Поздравление 🎈</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20x='8'%20y='27'%20width='48'%20height='31'%20rx='4'%20fill='%23ff6fa5'/%3E%3Crect%20x='5'%20y='18'%20width='54'%20height='13'%20rx='4'%20fill='%23ffd166'/%3E%3Crect%20x='28'%20y='18'%20width='8'%20height='40'%20fill='%23d4508b'/%3E%3Cpath%20d='M32%2018C24%205%2011%208%2016%2016c3%206%2016%202%2016%202zM32%2018C40%205%2053%208%2048%2016c-3%206-16%202-16%202z'%20fill='%23d4508b'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <style>
    /* фото показываем целиком, без обрезки лиц (и вертикальные, и горизонтальные) */
    .pop { aspect-ratio: auto; height: auto; object-fit: contain; }
  </style>
</head>
<body>
  <div class="bg-sparks"></div>
  <div class="stage" id="stage"></div>

  <main class="page">
    <div class="congrats-top">
      <h2>Тебя поздравляют! 🎉<span class="wave off" id="wave"><i></i><i></i><i></i><i></i><i></i></span></h2>
    </div>

    <div class="congrats-actions">
      <button class="btn pulse" id="playBtn">▶ Включить поздравление</button>
      <a class="btn ghost hidden" id="nextBtn" href="joke.html" data-next>Далее →</a>
    </div>
  </main>

  <audio id="voice" preload="auto"></audio>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    var audio = document.getElementById("voice");
    var wave = document.getElementById("wave");
    var playBtn = document.getElementById("playBtn");
    var nextBtn = document.getElementById("nextBtn");
    audio.src = CONFIG.voice;

    var started = false;

    function showNext() { nextBtn.classList.remove("hidden"); }

    function startShow() {
      if (started) return;
      started = true;
      playBtn.classList.add("hidden");
      spawnLoop();
    }

    function play() {
      startShow();
      audio.play().then(function () {
        wave.classList.remove("off");
      }).catch(function () {
        // если записи ещё нет — просто показываем фото и кнопку
        showNext();
      });
    }

    playBtn.addEventListener("click", play);
    audio.addEventListener("ended", function () {
      wave.classList.add("off");
      showNext();
    });
    // запасной вариант: кнопка «Далее» появляется через 40 секунд в любом случае
    playBtn.addEventListener("click", function () { setTimeout(showNext, 40000); });

    // ---- всплывающие фото ----
    var stage = document.getElementById("stage");
    var idx = 0;

    function spawn() {
      if (!CONFIG.photos.length) return;
      var src = CONFIG.photos[idx % CONFIG.photos.length];
      idx++;
      var img = new Image();
      img.className = "pop";
      img.onload = function () {
        img.style.setProperty("--r", (Math.random() * 20 - 10) + "deg");
        stage.appendChild(img); // сначала добавляем, чтобы узнать реальный размер
        var w = stage.clientWidth, h = stage.clientHeight;
        var iw = img.offsetWidth || 160, ih = img.offsetHeight || 210;
        img.style.left = Math.random() * Math.max(10, w - iw - 10) + "px";
        img.style.top = Math.random() * Math.max(10, h - ih - 10) + "px";
        setTimeout(function () { img.remove(); }, 6200);
      };
      img.onerror = function () { /* нет файла — пропускаем */ };
      img.src = src;
    }

    function spawnLoop() {
      spawn();
      setInterval(spawn, 1800);
    }
  </script>
</body>
</html>
