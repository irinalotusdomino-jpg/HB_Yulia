<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Твой сертификат 🎟️</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg-sparks"></div>

  <main class="page">
    <div class="ticket">
      <h2>🎟️ Подарочный сертификат</h2>
      <p>Для Юли. С днём рождения! 💖</p>
    </div>

    <a class="btn pulse" id="dl" href="#" download>⬇ Скачать сертификат</a>

    <p class="link-small">С любовью, твои ❤️</p>
  </main>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script>
    var dl = document.getElementById("dl");
    dl.href = CONFIG.certificate;
    dl.setAttribute("download", CONFIG.certificateFileName);
    launchConfetti(140);
    setTimeout(function () { launchConfetti(90); }, 3500);
  </script>
</body>
</html>
